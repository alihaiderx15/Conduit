[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-ai"
version = "3.1.8"
description = "Provider-neutral Conduit backend with safe tool orchestration"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-genai>=1.32.0",
  "httpx>=0.27.0",
  "Pillow>=10.4.0",
  "imageio-ffmpeg>=0.6.0",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "python-docx>=1.1.2",
  "pypdf>=5.0.0",
  "reportlab>=4.2.0",
  "PyAutoGUI>=0.9.54",
  "PySide6>=6.8.0",
  "psutil>=6.0.0",
  "pywinauto>=0.6.9",
  "pycaw>=20240210",
  "playwright>=1.48.0",
  "yt-dlp>=2025.1.15",
  "youtube-transcript-api>=1.2.0",
  "pytesseract>=0.3.13",
  "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
file_processing_extra = ["pytesseract>=0.3.13", "faster-whisper>=1.1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["conduit*"]
exclude = ["downloads*", "tests*", "scripts*"]

[tool.setuptools.package-data]
"conduit.core" = ["prompt.txt"]
